databases:
  - name: mini-ai-ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce

services:
  - type: web
    name: mini-ai-ecommerce-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-ai-ecommerce-db
          property: connectionString
      # Auto-generated by Render at provision time - never stored in git.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      # sync: false = set this manually in the Render dashboard after the first deploy.
      # Never committed to git; paste the real value directly into Render's env var UI.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: inr
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Set to the deployed Vercel frontend URL once it exists (used for CORS + Stripe
      # redirect URLs) - defaults to localhost so the free-tier build doesn't fail before
      # a frontend URL exists yet.
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
